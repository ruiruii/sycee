  <text x="1044" y="274" font-size="10.5" fill="#9ca3af" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">7a9bca348b5227ec</text>
  <text x="52" y="304" font-size="11.5" fill="#111827" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">valid-settlement-in-flight</text>
  <text x="368" y="304" font-size="11.5" fill="#374151" font-weight="400">L1</text>
  <text x="452" y="304" font-size="11.5" fill="#15803d" font-weight="600">L1</text>
  <text x="512" y="304" font-size="11.5" fill="#15803d" font-weight="400">pass</text>
  <text x="578" y="304" font-size="11.5" fill="#15803d" font-weight="400">pass</text>
  <text x="664" y="304" font-size="11.5" fill="#374151" font-weight="400">in_flight is not finality</text>
  <text x="1044" y="304" font-size="10.5" fill="#9ca3af" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">04a7cc0f4cb26497</text>
  <rect x="40" y="318" width="1100" height="30" fill="#f9fafb"/>
  <text x="52" y="334" font-size="11.5" fill="#111827" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">valid-settlement-settled-undelivered</text>
  <text x="368" y="334" font-size="11.5" fill="#374151" font-weight="400">L1</text>
  <text x="452" y="334" font-size="11.5" fill="#15803d" font-weight="600">L1</text>
  <text x="512" y="334" font-size="11.5" fill="#15803d" font-weight="400">pass</text>
  <text x="578" y="334" font-size="11.5" fill="#15803d" font-weight="400">pass</text>
  <text x="664" y="334" font-size="11.5" fill="#374151" font-weight="400">paid without fulfilment — dispute material</text>
  <text x="1044" y="334" font-size="10.5" fill="#9ca3af" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">6bf2de798b154df4</text>
  <text x="52" y="364" font-size="11.5" fill="#111827" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">invalid-settlement-absent-delivered</text>
  <text x="368" y="364" font-size="11.5" fill="#374151" font-weight="400">invalid</text>
  <text x="452" y="364" font-size="11.5" fill="#15803d" font-weight="600">invalid</text>
  <text x="512" y="364" font-size="11.5" fill="#15803d" font-weight="400">pass</text>
  <text x="578" y="364" font-size="11.5" fill="#15803d" font-weight="400">pass</text>
  <text x="664" y="364" font-size="11.5" fill="#374151" font-weight="400">contradiction: absent + delivered</text>
  <text x="1044" y="364" font-size="10.5" fill="#9ca3af" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">1f7f317ae8961318</text>
  <rect x="40" y="378" width="1100" height="30" fill="#f9fafb"/>
  <text x="52" y="394" font-size="11.5" fill="#111827" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">invalid-missing-consumed</text>
  <text x="368" y="394" font-size="11.5" fill="#374151" font-weight="400">invalid</text>
  <text x="452" y="394" font-size="11.5" fill="#15803d" font-weight="600">invalid</text>
  <text x="512" y="394" font-size="11.5" fill="#b91c1c" font-weight="400">fail</text>
  <text x="578" y="394" font-size="11.5" fill="#15803d" font-weight="400">pass</text>
  <text x="664" y="394" font-size="11.5" fill="#374151" font-weight="400">schema: result.consumed missing</text>
  <text x="1044" y="394" font-size="10.5" fill="#9ca3af" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">1eee4f2d1ba0bce3</text>
  <text x="52" y="424" font-size="11.5" fill="#111827" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">invalid-tampered-redeem-count</text>
  <text x="368" y="424" font-size="11.5" fill="#374151" font-weight="400">invalid</text>
  <text x="452" y="424" font-size="11.5" fill="#15803d" font-weight="600">invalid</text>
  <text x="512" y="424" font-size="11.5" fill="#15803d" font-weight="400">pass</text>
  <text x="578" y="424" font-size="11.5" fill="#b91c1c" font-weight="400">fail</text>
  <text x="664" y="424" font-size="11.5" fill="#374151" font-weight="400">signature fails</text>
  <text x="1044" y="424" font-size="10.5" fill="#9ca3af" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">9337edeb463b37bb</text>
  <rect x="40" y="438" width="1100" height="30" fill="#f9fafb"/>
  <text x="52" y="454" font-size="11.5" fill="#111827" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">invalid-embedded-proof</text>
  <text x="368" y="454" font-size="11.5" fill="#374151" font-weight="400">invalid</text>
  <text x="452" y="454" font-size="11.5" fill="#15803d" font-weight="600">invalid</text>
  <text x="512" y="454" font-size="11.5" fill="#15803d" font-weight="400">pass</text>
  <text x="578" y="454" font-size="11.5" fill="#15803d" font-weight="400">pass</text>
  <text x="664" y="454" font-size="11.5" fill="#374151" font-weight="400">red line: embedded credential</text>
  <text x="1044" y="454" font-size="10.5" fill="#9ca3af" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">94fb6bbc0e72178e</text>
  <text x="52" y="484" font-size="11.5" fill="#111827" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">invalid-unsigned-l0</text>
  <text x="368" y="484" font-size="11.5" fill="#374151" font-weight="400">L0</text>
  <text x="452" y="484" font-size="11.5" fill="#15803d" font-weight="600">L0</text>
  <text x="512" y="484" font-size="11.5" fill="#b91c1c" font-weight="400">fail</text>
  <text x="578" y="484" font-size="11.5" fill="#b91c1c" font-weight="400">fail</text>
  <text x="664" y="484" font-size="11.5" fill="#374151" font-weight="400">no signature</text>
  <text x="1044" y="484" font-size="10.5" fill="#9ca3af" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">26a151da6b12a873</text>
  <line x1="40" y1="518" x2="1140" y2="518" stroke="#e5e7eb"/>
  <text x="40" y="548" font-size="13" fill="#111827" font-weight="600">Why the four invalid ones are the point</text>
  <text x="40" y="570" font-size="12" fill="#4b5563" font-weight="400">Each invalid vector changes one thing a signed envelope must not survive, and keeps the rest valid. An implementation that checks shape and stops there passes invalid-tampered-redeem-count.</text>
  <text x="40" y="589" font-size="12" fill="#4b5563" font-weight="400">invalid-unsigned-l0 is not a failure of the format: it reports L0, telemetry an implementation may emit without a key. It is listed so that "no signature" reads as a limit, not a pass.</text>
  <text x="40" y="608" font-size="12" fill="#4b5563" font-weight="400">Repeat the tamper yourself: change any byte of a valid vector and run the checker on that one file. It must stop matching its manifest entry.</text>
</svg>
