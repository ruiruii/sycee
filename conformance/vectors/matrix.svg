  <text x="512" y="244" font-size="11.5" fill="#15803d" font-weight="400">pass</text>
  <text x="578" y="244" font-size="11.5" fill="#15803d" font-weight="400">pass</text>
  <text x="664" y="244" font-size="11.5" fill="#374151" font-weight="400">redeem_count = 3</text>
  <text x="1044" y="244" font-size="10.5" fill="#9ca3af" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">f420fa7fd8083560</text>
  <rect x="40" y="258" width="1100" height="30" fill="#f9fafb"/>
  <text x="52" y="274" font-size="11.5" fill="#111827" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">valid-agent-side-bilateral</text>
  <text x="368" y="274" font-size="11.5" fill="#374151" font-weight="400">L2</text>
  <text x="452" y="274" font-size="11.5" fill="#15803d" font-weight="600">L2</text>
  <text x="512" y="274" font-size="11.5" fill="#15803d" font-weight="400">pass</text>
  <text x="578" y="274" font-size="11.5" fill="#15803d" font-weight="400">pass</text>
