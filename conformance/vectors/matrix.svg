<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="676" viewBox="0 0 1180 676" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect width="1180" height="676" fill="#ffffff"/>
  <text x="40" y="52" font-size="24" fill="#111827" font-weight="600">sycee conformance vectors — what each one proves</text>
  <text x="40" y="80" font-size="13" fill="#6b7280" font-weight="400">12 signed envelopes, run through the same checker the CLI uses. Expected verdicts are read from manifest.json before the run; a vector that stops failing is a regression.</text>
  <text x="40" y="99" font-size="13" fill="#6b7280" font-weight="400">Reproduce: npm run verify (exit 0 means every row matched). Generated by conformance/vectors/print-matrix.mjs — not maintained by hand.</text>
  <rect x="40" y="108" width="1100" height="30" fill="#111827"/>
  <text x="52" y="128" font-size="11" fill="#ffffff" font-weight="600">vector</text>
  <text x="368" y="128" font-size="11" fill="#ffffff" font-weight="600">expected</text>
  <text x="452" y="128" font-size="11" fill="#ffffff" font-weight="600">got</text>
  <text x="512" y="128" font-size="11" fill="#ffffff" font-weight="600">schema</text>
  <text x="578" y="128" font-size="11" fill="#ffffff" font-weight="600">signature</text>
  <text x="664" y="128" font-size="11" fill="#ffffff" font-weight="600">what it proves</text>
  <text x="1044" y="128" font-size="11" fill="#ffffff" font-weight="600">sha256</text>
  <rect x="40" y="138" width="1100" height="30" fill="#f9fafb"/>
  <text x="52" y="154" font-size="11.5" fill="#111827" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">valid-consumed-yes</text>
  <text x="368" y="154" font-size="11.5" fill="#374151" font-weight="400">L2</text>
  <text x="452" y="154" font-size="11.5" fill="#15803d" font-weight="600">L2</text>
  <text x="512" y="154" font-size="11.5" fill="#15803d" font-weight="400">pass</text>
  <text x="578" y="154" font-size="11.5" fill="#15803d" font-weight="400">pass</text>
  <text x="664" y="154" font-size="11.5" fill="#374151" font-weight="400">buyer confirms the result was used</text>
  <text x="1044" y="154" font-size="10.5" fill="#9ca3af" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">6981c95440dc8d67</text>
  <text x="52" y="184" font-size="11.5" fill="#111827" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">valid-consumed-unknown</text>
  <text x="368" y="184" font-size="11.5" fill="#374151" font-weight="400">L1</text>
  <text x="452" y="184" font-size="11.5" fill="#15803d" font-weight="600">L1</text>
  <text x="512" y="184" font-size="11.5" fill="#15803d" font-weight="400">pass</text>
  <text x="578" y="184" font-size="11.5" fill="#15803d" font-weight="400">pass</text>
  <text x="664" y="184" font-size="11.5" fill="#374151" font-weight="400">buyer runtime not instrumented — unknown, not false</text>
  <text x="1044" y="184" font-size="10.5" fill="#9ca3af" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">debc9f3c65a1a88c</text>
  <rect x="40" y="198" width="1100" height="30" fill="#f9fafb"/>
  <text x="52" y="214" font-size="11.5" fill="#111827" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">valid-consumed-no-idle-spend</text>
  <text x="368" y="214" font-size="11.5" fill="#374151" font-weight="400">L2</text>
  <text x="452" y="214" font-size="11.5" fill="#15803d" font-weight="600">L2</text>
  <text x="512" y="214" font-size="11.5" fill="#15803d" font-weight="400">pass</text>
  <text x="578" y="214" font-size="11.5" fill="#15803d" font-weight="400">pass</text>
  <text x="664" y="214" font-size="11.5" fill="#374151" font-weight="400">idle spend</text>
  <text x="1044" y="214" font-size="10.5" fill="#9ca3af" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">fa29bb78e1857634</text>
  <text x="52" y="244" font-size="11.5" fill="#111827" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">valid-redeem-count-3</text>
