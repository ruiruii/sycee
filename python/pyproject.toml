[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sycee-verify"
version = "0.1.0"
description = "Independent Python verifier for SYCEE VSR envelopes (SPEC.md v0.1)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }

[project.optional-dependencies]
cryptography = ["cryptography>=41"]
pynacl = ["PyNaCl>=1.5"]

[project.scripts]
sycee-verify = "sycee_verify.cli:main"

[tool.setuptools]
packages = ["sycee_verify"]
