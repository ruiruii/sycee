name: Demo page

# Publishes examples/near-anchor/demo only. workflow_dispatch so it does not
# run until the repository owner enables GitHub Pages (source: GitHub Actions)
# and starts this workflow. This file does not change repository settings.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: examples/near-anchor/demo

      - id: deployment
        uses: actions/deploy-pages@v4
