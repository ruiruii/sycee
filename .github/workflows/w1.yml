name: w1-evidence-scan

# Automated x402 evidence-layer status scan (route B / "裁判位" content asset).
# Runs weekly + on demand. Discovers public ledgers via CDP discovery, probes
# each with gates-probe, and commits reports/w1.md and reports/w1.json.
# report.mjs writes both of those from the raw scan. reports/w1-en.md is a
# hand-written English page (data from 2026-10-10) and this job does not
# rewrite it — there is no English renderer in tools/w1.
# Real scans need a normal egress (GitHub-hosted runner); the sandbox cannot
# reach the ledger host, so this is the only place the live data is produced.

on:
  schedule:
    - cron: '23 4 * * 1'        # every Monday 04:23 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The probe stack has NO external (registry) dependencies — it is pure
      # node:crypto + workspace packages. Link them locally; skip npm install
      # entirely so the job never depends on registry reachability.
      - name: Link workspace packages
        run: |
          mkdir -p node_modules/@sycee
          ln -s ../../packages/core node_modules/@sycee/core
          ln -s ../../packages/adapter-automaton node_modules/@sycee/adapter-automaton
          ln -s ../../packages/probe node_modules/@sycee/probe

      - name: Discover → scan → report
        run: |
          node tools/w1/discover.mjs --out tools/w1/endpoints.txt --sellers-out tools/w1/sellers.txt --discovery-out tools/w1/discovery.json
          node tools/w1/scan.mjs --list tools/w1/endpoints.txt --sellers tools/w1/sellers.txt --out tools/w1/w1-raw.json
          node tools/w1/report.mjs

      - name: Commit results
        run: |
          git config user.name "SYCEE bot"
          git config user.email "bot@sycee.local"
          git pull --rebase --autostash
          git add reports/w1.md reports/w1.json tools/w1/w1-raw.json tools/w1/endpoints.txt tools/w1/sellers.txt tools/w1/discovery.json
          git diff --cached --quiet || git commit -m "chore(w1): automated evidence-layer scan [skip ci]"
          git push
