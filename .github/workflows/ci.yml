name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  conformance:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install
        run: npm install

      - name: Run test suite
        run: npm test

      - name: Verify conformance vectors
        run: npm run verify

      - name: Regenerate vectors and assert no drift
        run: |
          npm run vectors
          git diff --exit-code conformance/vectors/ || {
            echo "::error::conformance vectors changed; run 'npm run vectors' and commit"
            exit 1
          }

      - name: Assert the published matrix still describes the vectors
        run: node conformance/vectors/print-matrix.mjs --check

      # The section 15 vectors are the strongest claim in this repository and the
      # one that failed hardest when a third party read the prose. A reader who
      # has only the markdown must reach the same rules as the constructor, so the
      # two tables a reader depends on are compared here on every change: the
      # closed reason set and the leg contract. A rule that lives in one place and
      # is written in another is a rule a reader will get wrong.
      - name: Assert the prose and the constructor agree on the rules
        run: npm run verify:docs

      - name: Judge the refusal vectors
        run: npm run verify:refusal

      # The entry point a reader meets before the specification: one command,
      # no reading. If it cannot answer on the vector set, it cannot answer on
      # anyone's receipt either.
      - name: Check the vector set through the command-line tool
        run: node bin/sycee-verify.mjs --dir conformance/refusal/vectors

      # The reader built from the markdown alone. It is the only check here that
      # was not written by the same hand that wrote the constructor, and it is
      # the one that found the four rules the other checkers could not.
      - name: Read the prose as a stranger would
        run: node conformance/refusal/prose-reader.mjs

  # The Python implementation is only worth having if it is checked on every
  # change. Without this job it would drift silently — still present, no longer
  # agreeing — and the claim in the README would rot from fact into folklore.
  python:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: pip install cryptography

      - name: Verify the same 12 vectors, independently
        run: PYTHONPATH=python python3 -m sycee_verify conformance/vectors/*.json

      - name: Run the verifier's own tests
        run: python3 -m unittest discover -s python/tests -v
